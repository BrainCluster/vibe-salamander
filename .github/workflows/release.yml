# Builds Vibe Salamander for x64 and ARM64 on every push to main (a check that it still builds).
# When the version in Directory.Build.props has no release yet, it also publishes the GitHub release
# "v<version>" with both zips and the notes from docs/releases/<version>.md.
# To release: raise <Version> in Directory.Build.props, add docs/releases/<version>.md, push.
name: Build and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        if: matrix.platform == 'x64'
        run: dotnet test tests/VibeSalamander.Core.Tests/VibeSalamander.Core.Tests.csproj -c Release

      - name: Publish
        run: >
          dotnet publish src/VibeSalamander.App/VibeSalamander.App.csproj
          -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
          --self-contained true -p:PublishReadyToRun=true
          -o publish/VibeSalamander

      - name: Zip
        shell: pwsh
        run: |
          Remove-Item publish/VibeSalamander/*.pdb -ErrorAction SilentlyContinue
          $zip = "VibeSalamander-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/VibeSalamander -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ${{ env.ZIP }}

  release:
    needs: [ version, build ]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="docs/releases/${VERSION}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "v${VERSION}" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Vibe Salamander ${VERSION}" \
            --notes-file "$notes"
