# Every push to main: a quick check - the tests and an x64 build of the app (a few minutes).
# When the version in Directory.Build.props has no release yet: the full x64 and ARM64 builds, and the
# GitHub release "v<version>" with both zips and the notes from docs/releases/<version>.md.
# To release: raise <Version> in Directory.Build.props, add docs/releases/<version>.md, push.
name: Build and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# a newer push replaces a run still going (a hung run must not hold the release)
concurrency:
  group: build-and-release
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: version
    if: needs.version.outputs.release != 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      - name: Test
        run: dotnet test tests/VibeSalamander.Core.Tests/VibeSalamander.Core.Tests.csproj -c Release --blame-hang-timeout 5m

      - name: Build the app
        run: dotnet build src/VibeSalamander.App/VibeSalamander.App.csproj -c Release -p:Platform=x64

      - name: Build the starter
        run: dotnet build src/VibeSalamander.Launcher/VibeSalamander.Launcher.csproj -c Release

      - name: Build the example plugin
        run: dotnet build samples/HelloPlugin/HelloPlugin.csproj -c Release

      # the installer script compiles (on a stand-in folder: the real one is built for releases only)
      - name: Check the installer script
        shell: pwsh
        run: |
          ./build/installer/inno.ps1
          New-Item -ItemType Directory -Force stand-in/lib | Out-Null
          Set-Content stand-in/VibeSalamander.exe 'stand-in'
          Set-Content stand-in/lib/VibeSalamander.exe 'stand-in'
          & $env:ISCC /Q /DVersion=0.0.0 /DArch=x64 "/DSource=$PWD\stand-in" "/DOutput=$PWD\stand-in-out" build/installer/VibeSalamander.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      - name: Test
        if: matrix.platform == 'x64'
        run: dotnet test tests/VibeSalamander.Core.Tests/VibeSalamander.Core.Tests.csproj -c Release --blame-hang-timeout 5m

      - name: Publish
        shell: pwsh
        run: ./build/publish.ps1 -Runtime ${{ matrix.rid }} -Output publish/VibeSalamander

      # the installer (before portable.flag goes into the folder: an installed copy keeps its settings in %AppData%)
      - name: Installer
        shell: pwsh
        run: |
          ./build/installer/inno.ps1
          $arch = if ('${{ matrix.rid }}' -eq 'win-arm64') { 'arm64' } else { 'x64' }
          & $env:ISCC /Q "/DVersion=${{ needs.version.outputs.version }}" "/DArch=$arch" "/DSource=$PWD\publish\VibeSalamander" "/DOutput=$PWD" build/installer/VibeSalamander.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "SETUP=VibeSalamander-${{ needs.version.outputs.version }}-${{ matrix.rid }}-setup.exe" >> $env:GITHUB_ENV

      # the zip is the portable version: portable.flag keeps everything in a Data folder beside the program
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType File -Force publish/VibeSalamander/portable.flag | Out-Null
          $zip = "VibeSalamander-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/VibeSalamander -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: 7-Zip plugin
        shell: pwsh
        run: |
          ./build/publish-7zip-plugin.ps1 -Runtime ${{ matrix.rid }} -Output publish/plugin/7-Zip
          $zip = "VibeSalamander-7-Zip-plugin-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/plugin/7-Zip -DestinationPath $zip
          "PLUGIN_ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            ${{ env.SETUP }}
            ${{ env.ZIP }}
            ${{ env.PLUGIN_ZIP }}

  release:
    needs: [ version, build ]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes="docs/releases/${VERSION}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "v${VERSION}" dist/*-setup.exe dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Vibe Salamander ${VERSION}" \
            --notes-file "$notes"

      # the Scoop bucket file and the winget manifests of this release (packaging/README.md)
      - name: Package manager files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          build/package-manifests.sh "$VERSION" dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add bucket packaging
          git commit -m "Scoop and winget files for ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
