# Every push to main: an x64 build of the app, the starter and the example plugin, without tests.
# Started by hand (gh workflow run release.yml --ref <branch> -f tests=...): the same build with Core tests:
#   tests=all (the default) every test, before a release; tests=CloudFilesTests, TranslationTests only the tests whose
#   names contain these (a feature's own tests), or a dotnet test filter expression; tests=none only the build.
# When the version in Directory.Build.props has no release yet: all Core tests, the full x64 and ARM64 builds, and
# the GitHub release "v<version>" with both zips and the notes from docs/releases/<version>.md.
# To release: run both workflows with tests=all on the branch, then raise <Version> in Directory.Build.props, add
# docs/releases/<version>.md, push to main.
name: Build and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tests:
        description: "all, none, or the test classes / names to run (comma-separated), or a dotnet test filter"
        type: string
        default: all

permissions:
  contents: write

# a newer push replaces a run still going (a hung run must not hold the release)
concurrency:
  group: build-and-release
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: version
    if: needs.version.outputs.release != 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      # only when started by hand: a push to main builds without tests (the tests ran on the branch)
      - name: Test
        id: test
        if: github.event_name == 'workflow_dispatch' && inputs.tests != 'none'
        shell: pwsh
        env:
          VIBE_BENCHMARKS: ${{ runner.temp }}\benchmarks.md
          TESTS: ${{ inputs.tests }}
        run: |
          $tests = "$env:TESTS".Trim()
          $filter = @()
          if ($tests -and $tests -ne 'all') {
            if ($tests -notmatch '[=~!&|]') {
              $tests = (($tests -split ',') | ForEach-Object { $_.Trim() } | Where-Object { $_ } | ForEach-Object { "FullyQualifiedName~$_" }) -join '|'
            }
            $filter = @('--filter', $tests)
            "Only the tests matching: $tests"
          }
          dotnet test tests/VibeSalamander.Core.Tests/VibeSalamander.Core.Tests.csproj -c Release --blame-hang-timeout 5m @filter

      # how long listing, sorting, searching and copying took (PerformanceTests), to compare from run to run
      - name: Speed (in the run's summary)
        if: always() && steps.test.outcome != 'skipped'
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP "benchmarks.md"
          if (Test-Path $file) { @("## Speed", "") + (Get-Content $file) | Add-Content $env:GITHUB_STEP_SUMMARY }

      - name: Build the app
        run: dotnet build src/VibeSalamander.App/VibeSalamander.App.csproj -c Release -p:Platform=x64

      - name: Build the starter
        run: dotnet build src/VibeSalamander.Launcher/VibeSalamander.Launcher.csproj -c Release

      - name: The administrator helper is beside the built program and starts
        shell: pwsh
        run: |
          $helper = Get-ChildItem src/VibeSalamander.App/bin -Recurse -Filter VibeSalamander.Elevated.exe | Select-Object -First 1
          if (-not $helper) { throw "VibeSalamander.Elevated.exe isn't beside the built program" }
          $run = Start-Process $helper.FullName -Wait -PassThru
          if ($run.ExitCode -ne 2) { throw "the helper didn't start as it should (exit code $($run.ExitCode), expected 2: no arguments)" }
          "Found and started: $($helper.FullName)"

      - name: Build the example plugin
        run: dotnet build samples/HelloPlugin/HelloPlugin.csproj -c Release

      # the installer script compiles (on a stand-in folder: the real one is built for releases only)
      - name: Check the installer script
        shell: pwsh
        run: |
          ./build/installer/inno.ps1
          New-Item -ItemType Directory -Force stand-in/lib | Out-Null
          Set-Content stand-in/VibeSalamander.exe 'stand-in'
          Set-Content stand-in/lib/VibeSalamander.exe 'stand-in'
          & $env:ISCC /Q /DVersion=0.0.0 /DArch=x64 "/DSource=$PWD\stand-in" "/DOutput=$PWD\stand-in-out" build/installer/VibeSalamander.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Windows integration (S3): the stand-in installed for this user with all three options, then uninstalled;
      # each option is checked in the registry both ways
      - name: Check the installer's Windows integration
        shell: pwsh
        run: |
          $setup = Get-ChildItem stand-in-out -Filter *-setup.exe | Select-Object -First 1
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Vibe Salamander'
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/TASKS=explorermenu,addtopath,wine' -Wait -PassThru
          if ($p.ExitCode) { throw "setup ended with $($p.ExitCode)" }
          $menu = 'HKCU:\Software\Classes\Directory\shell\VibeSalamander\command'
          $background = 'HKCU:\Software\Classes\Directory\Background\shell\VibeSalamander\command'
          $drive = 'HKCU:\Software\Classes\Drive\shell\VibeSalamander\command'
          $wine = 'HKCU:\Software\Classes\CLSID\{52205fd8-5dfb-447d-801a-d0b52f2e83e1}\shell\opennewwindow\command'
          foreach ($key in $menu, $background, $drive, $wine) {
            if (-not (Test-Path $key)) { throw "missing after install: $key" }
          }
          $command = (Get-ItemProperty $menu).'(default)'
          if ($command -ne "`"$app\VibeSalamander.exe`" `"%V`"") { throw "Explorer's command is $command" }
          if ((Get-ItemProperty $wine).DelegateExecute -ne '') { throw 'Win+E: DelegateExecute is not empty' }
          $path = (Get-ItemProperty 'HKCU:\Environment').Path
          if (-not ($path -split ';' | Where-Object { $_ -eq $app })) { throw "not on the PATH: $path" }
          "installed: Explorer menu, PATH, Win+E"

          $u = Start-Process (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode) { throw "uninstall ended with $($u.ExitCode)" }
          Start-Sleep -Seconds 3 # the uninstaller finishes from a copy of itself
          foreach ($key in 'HKCU:\Software\Classes\Directory\shell\VibeSalamander', 'HKCU:\Software\Classes\Directory\Background\shell\VibeSalamander',
                           'HKCU:\Software\Classes\Drive\shell\VibeSalamander', 'HKCU:\Software\Classes\CLSID\{52205fd8-5dfb-447d-801a-d0b52f2e83e1}') {
            if (Test-Path $key) { throw "left after uninstall: $key" }
          }
          $path = (Get-ItemProperty 'HKCU:\Environment').Path
          if ($path -split ';' | Where-Object { $_ -eq $app }) { throw "still on the PATH: $path" }
          "uninstalled: all three taken away"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      - name: Test
        if: matrix.platform == 'x64'
        env:
          VIBE_BENCHMARKS: ${{ runner.temp }}\benchmarks.md
        run: dotnet test tests/VibeSalamander.Core.Tests/VibeSalamander.Core.Tests.csproj -c Release --blame-hang-timeout 5m

      # how long listing, sorting, searching and copying took (PerformanceTests), to compare from run to run
      - name: Speed (in the run's summary)
        if: always() && matrix.platform == 'x64'
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP "benchmarks.md"
          if (Test-Path $file) { @("## Speed", "") + (Get-Content $file) | Add-Content $env:GITHUB_STEP_SUMMARY }

      # the times go with the release (speed.md), so the next release's notes compare with them
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'x64'
        continue-on-error: true
        with:
          name: speed
          path: ${{ runner.temp }}\benchmarks.md

      - name: Publish
        shell: pwsh
        run: ./build/publish.ps1 -Runtime ${{ matrix.rid }} -Output publish/VibeSalamander

      # the installer (before portable.flag goes into the folder: an installed copy keeps its settings in %AppData%)
      - name: Installer
        shell: pwsh
        run: |
          ./build/installer/inno.ps1
          $arch = if ('${{ matrix.rid }}' -eq 'win-arm64') { 'arm64' } else { 'x64' }
          & $env:ISCC /Q "/DVersion=${{ needs.version.outputs.version }}" "/DArch=$arch" "/DSource=$PWD\publish\VibeSalamander" "/DOutput=$PWD" build/installer/VibeSalamander.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "SETUP=VibeSalamander-${{ needs.version.outputs.version }}-${{ matrix.rid }}-setup.exe" >> $env:GITHUB_ENV

      # the zip is the portable version: portable.flag keeps everything in a Data folder beside the program
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType File -Force publish/VibeSalamander/portable.flag | Out-Null
          $zip = "VibeSalamander-${{ needs.version.outputs.version }}-portable-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/VibeSalamander -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: 7-Zip plugin
        shell: pwsh
        run: |
          ./build/publish-7zip-plugin.ps1 -Runtime ${{ matrix.rid }} -Output publish/plugin/7-Zip
          $zip = "VibeSalamander-7-Zip-plugin-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/plugin/7-Zip -DestinationPath $zip
          "PLUGIN_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Media Info plugin
        shell: pwsh
        run: |
          ./build/publish-mediainfo-plugin.ps1 -Runtime ${{ matrix.rid }} -Output "publish/plugin/Media Info"
          $zip = "VibeSalamander-Media-Info-plugin-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path "publish/plugin/Media Info" -DestinationPath $zip
          "MEDIAINFO_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Git plugin
        shell: pwsh
        run: |
          ./build/publish-git-plugin.ps1 -Runtime ${{ matrix.rid }} -Output "publish/plugin/Git"
          $zip = "VibeSalamander-Git-plugin-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path "publish/plugin/Git" -DestinationPath $zip
          "GIT_ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            ${{ env.SETUP }}
            ${{ env.ZIP }}
            ${{ env.PLUGIN_ZIP }}
            ${{ env.MEDIAINFO_ZIP }}
            ${{ env.GIT_ZIP }}

  release:
    needs: [ version, build ]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes=/tmp/notes.md
          if [ -f "docs/releases/${VERSION}.md" ]; then cp "docs/releases/${VERSION}.md" "$notes"; else : > "$notes"; fi
          # the speed of this release next to the previous one's (its speed.md); never stops the release
          extra=()
          if [ -f dist/benchmarks.md ]; then
            cp dist/benchmarks.md dist/speed.md
            extra=(dist/speed.md)
            previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // empty' || true)
            mkdir -p /tmp/previous
            if [ -n "$previous" ]; then
              gh release download "$previous" --repo "$GITHUB_REPOSITORY" --pattern speed.md --dir /tmp/previous || true
            fi
            {
              echo
              if [ -f /tmp/previous/speed.md ]; then
                python3 build/speed-notes.py "$VERSION" dist/benchmarks.md "${previous#v}" /tmp/previous/speed.md
              else
                python3 build/speed-notes.py "$VERSION" dist/benchmarks.md
              fi
            } >> "$notes" || true
          fi
          gh release create "v${VERSION}" dist/*-setup.exe dist/*.zip "${extra[@]}" \
            --target "$GITHUB_SHA" \
            --title "Vibe Salamander ${VERSION}" \
            --notes-file "$notes"

      # the Scoop bucket file and the winget manifests of this release (packaging/README.md)
      - name: Package manager files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          build/package-manifests.sh "$VERSION" dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add bucket packaging
          git commit -m "Scoop and winget files for ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
