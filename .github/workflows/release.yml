# Builds Vibe Salamander for x64 and ARM64 and publishes a GitHub release with the zips.
# Runs when a version tag ("v0.1.0") is pushed; can also be started by hand (then it only builds).
name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        if: matrix.platform == 'x64'
        run: dotnet test tests/VibeSalamander.Core.Tests/VibeSalamander.Core.Tests.csproj -c Release

      - name: Publish
        run: >
          dotnet publish src/VibeSalamander.App/VibeSalamander.App.csproj
          -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
          --self-contained true
          -o publish/VibeSalamander

      - name: Zip
        shell: pwsh
        run: |
          Remove-Item publish/VibeSalamander/*.pdb -ErrorAction SilentlyContinue
          $zip = "VibeSalamander-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/VibeSalamander -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ${{ env.ZIP }}

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${version}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Vibe Salamander $version" \
            --notes-file "$notes"
